<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>課堂抽籤</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="課堂抽籤">
  <meta name="theme-color" content="#0b1a3a">
  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbyIcwRVPZuf8-caxvGINS4-dk63l7QBcLUfLNaAvfFVrmyBhnUzOsbVvFDgs7GHxxKU/exec';
    // 從主畫面圖示開啟時，直接進入課堂抽籤系統
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (standalone) window.location.replace(APP_URL);
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1a3a;
      color: #fff;
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    img { width: 140px; height: 140px; border-radius: 32px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    h1 { font-size: 28px; margin: 20px 0 8px; }
    p { font-size: 18px; line-height: 1.7; color: #cbd5e1; margin: 0 0 24px; }
    a.btn {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 16px;
      background: #2563eb;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div>
    <img src="apple-touch-icon.png" alt="課堂抽籤圖示">
    <h1>課堂加權點名抽籤</h1>
    <p>iPad 請按 Safari 的「分享」→「加入主畫面」，<br>之後點主畫面圖示就會直接開啟系統。</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbyIcwRVPZuf8-caxvGINS4-dk63l7QBcLUfLNaAvfFVrmyBhnUzOsbVvFDgs7GHxxKU/exec">直接開啟系統</a>
  </div>
</body>
</html>
